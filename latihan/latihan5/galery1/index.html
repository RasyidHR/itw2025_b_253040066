<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>The Avengers</h1>

    <div class="container">
      <ul class="gallery">
        <li>
          <a href="#gambar-1">
            <img src="img/thumbs/cap.jpg" alt="captain america" />
            <span>Captain America</span>
          </a>
        </li>

        <li>
          <a href="#gambar-2">
            <img src="img/thumbs/ironman.jpg" alt="iron man" />
            <span>Iron Man</span>
          </a>
        </li>

        <li>
          <a href="#gambar-3">
            <img src="img/thumbs/tor.jpg" alt="thor" />
            <span>Thor</span>
          </a>
        </li>

        <li>
          <a href="#gambar-4">
            <img src="img/thumbs/hulk.jpg" alt="hulk" />
            <span>Hulk</span>
          </a>
        </li>
      </ul>
      <div class="clear"></div>
    </div>

    <!-- FULL IMAGE OVERLAY -->
    <div class="overlay" id="gambar-1">
      <a href="#!" class="close">x close</a>
      <a href="#gambar-4" class="prev">prev</a>
      <img src="img/full/cap.jpg" alt="captain america full" />
      <a href="#gambar-2" class="next">next</a>
    </div>

    <div class="overlay" id="gambar-2">
      <a href="#!" class="close">x close</a>
      <a href="#gambar-1" class="prev">prev</a>
      <img src="img/full/ironman.jpg" alt="iron man full" />
      <a href="#gambar-3" class="next">next</a>
    </div>

    <div class="overlay" id="gambar-3">
      <a href="#!" class="close">x close</a>
      <a href="#gambar-2" class="prev">prev</a>
      <img src="img/full/tor.jpg" alt="thor full" />
      <a href="#gambar-4" class="next">next</a>
    </div>

    <div class="overlay" id="gambar-4">
      <a href="#!" class="close">x close</a>
      <a href="#gambar-3" class="prev">prev</a>
      <img src="img/full/hulk.jpg" alt="hulk full" />
      <a href="#gambar-1" class="next">next</a>
    </div>
  </body>
</html>
