<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box model</title>
    <style>
      .kotak1 {
        width: 150px;
        height: 150px;
        background-color: blue;
        margin-left: -100px;
        transition: 1s;
        transform: rotate(-180px);
      }

      .kotak1:hover {
        margin-left: 0px;
        transform: rotate(0);
      }

      .kotak2 {
        width: 150px;
        height: 150px;
        background-color: aqua;
        margin-top: 40px;
        margin-left: -100px;
        transition: 1s;
        border: 6px solid;
      }

      .kotak2:hover {
        margin-left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="kotak1">kotak1</div>
    <div class="kotak2">kotak2</div>
  </body>
</html>
